name: Add daily Telugu quotes
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-daily-quotes.mjs"
      - ".github/workflows/daily-quotes.yml"
permissions:
  contents: write
concurrency:
  group: daily-quotes
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate quotes for every category (offline fallback)
        run: node scripts/generate-daily-quotes.mjs
      - name: Commit and push new quotes
        run: |
          if git diff --quiet -- quotes/; then
            echo "No new quotes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes/
          git commit -m "content: add Telugu quotes across all categories"
          git push
