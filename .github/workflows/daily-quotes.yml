name: Add daily Telugu quotes
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-daily-quotes.mjs"
      - ".github/workflows/daily-quotes.yml"
permissions:
  contents: write
concurrency:
  group: daily-quotes
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      added: \${{ steps.generate.outputs.added }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate exactly 30 new quotes across all categories
        id: generate
        run: node scripts/generate-daily-quotes.mjs
      - name: Show quote generation result
        run: |
          echo "::notice title=Quote generation::Added \${{ steps.generate.outputs.added }} new quotes across 13 categories."
          echo "### Workflow result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total added: \${{ steps.generate.outputs.added }} / 30**" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push new quotes
        run: |
          if git diff --quiet -- quotes/; then
            echo "No quote changes detected; refusing to report a successful 30-quote run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes/
          git commit -m "content: add 30 Telugu-English quotes across categories"
          git push
