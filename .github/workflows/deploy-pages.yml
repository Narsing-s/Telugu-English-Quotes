name: Deploy quotes website
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "quotes/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Add daily Telugu quotes"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest website and quote data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify website files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -d quotes
          echo "Website source and quote data are present."
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
